<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | LAYER 0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <style>
        :root { color-scheme: dark; --bg: #101212; --panel: #191e1d; --line: #303936; --text: #edf0eb; --muted: #9da7a0; --accent: #d5ad70; }
        * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 10%, #27302c 0, transparent 35%), var(--bg); color: var(--text); font-family: Manrope, sans-serif; }
        main { width: min(920px, 100%); margin: auto; padding: 4rem 1.5rem; } .eyebrow { color: var(--accent); font: 500 .75rem 'DM Mono', monospace; letter-spacing: 2px; text-transform: uppercase; }
        h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 600; margin: .8rem 0 2rem; } h2 { font-size: 1.1rem; margin: 0 0 1.2rem; }
        .panel { background: var(--panel); border: 1px solid var(--line); padding: 1.5rem; margin-top: 1.5rem; } form { display: grid; gap: 1rem; } label { color: var(--muted); font-size: .8rem; } input { display: block; width: 100%; margin-top: .4rem; padding: .85rem; color: var(--text); background: #101313; border: 1px solid var(--line); font: inherit; } button { padding: .85rem 1rem; color: #151817; background: var(--accent); border: 0; cursor: pointer; font: 600 .85rem Manrope; } button.secondary { color: var(--text); background: transparent; border: 1px solid var(--line); } .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; } .hidden { display: none; } .status { color: var(--muted); min-height: 1.5em; } @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">LAYER 0 / Panel privado</div>
    <h1>Administrar contenido.</h1>
    <section class="panel" id="loginPanel">
        <h2>Iniciar sesión</h2>
        <form id="loginForm"><label>Correo<input id="email" type="email" required autocomplete="email"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form>
    </section>
    <section class="hidden" id="dashboard">
        <div class="panel"><h2>Nuevo proyecto</h2><form id="projectForm"><label>Nombre<input id="projectTitle" required></label><label>URLs de imágenes, separadas por comas<input id="projectImages" placeholder="https://..." required></label><button>Guardar proyecto</button></form></div>
        <div class="panel"><h2>Nuevo miembro</h2><form id="memberForm"><div class="row"><label>Nombre<input id="memberName" required></label><label>Rol<input id="memberRole" required></label></div><button>Guardar miembro</button></form></div>
        <div class="panel"><button class="secondary" id="logout">Cerrar sesión</button></div>
    </section>
    <p class="status" id="status"></p>
</main>
<script>
    const settings = window.SUPABASE_CONFIG;
    const loginPanel = document.getElementById('loginPanel');
    const dashboard = document.getElementById('dashboard');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const projectTitleInput = document.getElementById('projectTitle');
    const projectImagesInput = document.getElementById('projectImages');
    const memberNameInput = document.getElementById('memberName');
    const memberRoleInput = document.getElementById('memberRole');
    const status = document.getElementById('status');
    const setStatus = message => { status.textContent = message; };
    const isConfigured = settings && settings.url && !settings.url.includes('TU-PROYECTO') && settings.anonKey && !settings.anonKey.includes('TU-CLAVE');
    const client = isConfigured ? supabase.createClient(settings.url, settings.anonKey) : null;
    if (!isConfigured) setStatus('Configura supabase-config.js con la URL y la clave pública de tu proyecto.');
    const showDashboard = () => { loginPanel.classList.add('hidden'); dashboard.classList.remove('hidden'); };
    const explainAuthError = error => {
        if (error.message.includes('Invalid login credentials')) return 'Correo o contraseña incorrectos. Verifica que el usuario exista en Supabase > Authentication > Users.';
        if (error.message.toLowerCase().includes('email not confirmed')) return 'Confirma el correo de Supabase antes de iniciar sesión o activa Auto Confirm User.';
        return error.message;
    };
    if (client) client.auth.getSession().then(({ data }) => { if (data.session) showDashboard(); });
    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault(); if (!client) return setStatus('Falta configurar Supabase.'); setStatus('Iniciando sesión...');
        const { error } = await client.auth.signInWithPassword({ email: emailInput.value.trim(), password: passwordInput.value });
        if (error) return setStatus(explainAuthError(error));
        showDashboard(); setStatus('Sesión iniciada.');
    });
    document.getElementById('projectForm').addEventListener('submit', async event => {
        event.preventDefault(); const images = projectImagesInput.value.split(',').map(item => item.trim()).filter(Boolean);
        const { error } = await client.from('projects').insert({ title: projectTitleInput.value, images });
        setStatus(error ? error.message : 'Proyecto guardado correctamente.'); if (!error) event.target.reset();
    });
    document.getElementById('memberForm').addEventListener('submit', async event => {
        event.preventDefault(); const { error } = await client.from('members').insert({ name: memberNameInput.value, role: memberRoleInput.value });
        setStatus(error ? error.message : 'Miembro guardado correctamente.'); if (!error) event.target.reset();
    });
    document.getElementById('logout').addEventListener('click', async () => { await client.auth.signOut(); dashboard.classList.add('hidden'); loginPanel.classList.remove('hidden'); setStatus('Sesión cerrada.'); });
</script>
</body>
</html>
