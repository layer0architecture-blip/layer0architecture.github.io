<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración | LAYER 0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js?v=50d3829"></script>
    <style>
        :root { color-scheme: dark; --bg: #101212; --panel: #191e1d; --line: #303936; --text: #edf0eb; --muted: #9da7a0; --accent: #d5ad70; }
        * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 80% 10%, #27302c 0, transparent 35%), var(--bg); color: var(--text); font-family: Manrope, sans-serif; }
        main { width: min(920px, 100%); margin: auto; padding: 4rem 1.5rem; } .eyebrow { color: var(--accent); font: 500 .75rem 'DM Mono', monospace; letter-spacing: 2px; text-transform: uppercase; }
        h1 { font-size: clamp(2rem, 5vw, 4rem); font-weight: 600; margin: .8rem 0 2rem; } h2 { font-size: 1.1rem; margin: 0 0 1.2rem; }
        .panel { background: var(--panel); border: 1px solid var(--line); padding: 1.5rem; margin-top: 1.5rem; } form { display: grid; gap: 1rem; } label { color: var(--muted); font-size: .8rem; } input, textarea { display: block; width: 100%; margin-top: .4rem; padding: .85rem; color: var(--text); background: #101313; border: 1px solid var(--line); font: inherit; } textarea { min-height: 100px; resize: vertical; } button { padding: .85rem 1rem; color: #151817; background: var(--accent); border: 0; cursor: pointer; font: 600 .85rem Manrope; } button.secondary { color: var(--text); background: transparent; border: 1px solid var(--line); } button.danger { color: #f5d8d2; background: transparent; border: 1px solid #8b5148; } .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; } .hidden { display: none; } .status { color: var(--muted); min-height: 1.5em; } .records { display: grid; gap: .6rem; margin-top: 1.2rem; } .record { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: .8rem; border: 1px solid var(--line); } .record small { display: block; color: var(--muted); margin-top: .25rem; } @media (max-width: 640px) { .row { grid-template-columns: 1fr; } .record { align-items: flex-start; flex-direction: column; } }
        .image-editor { display: grid; gap: .5rem; }
        .image-row { border: 1px solid var(--line); padding: .6rem; display: grid; grid-template-columns: 86px minmax(0, 1fr) auto; gap: .7rem; align-items: start; }
        .image-row-content { min-width: 0; }
        .image-preview { width: 86px; height: 64px; object-fit: cover; border: 1px solid var(--line); background: #101313; }
        .cover-choice { display: flex; align-items: center; gap: .4rem; color: var(--muted); font-size: .75rem; }
        .service-order { display: inline-flex; gap: .35rem; margin-right: .6rem; }
        .service-order button { padding: .35rem .55rem; }
        .admin-menu { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: .7rem; margin: 1.5rem 0; }
        .admin-menu details { border: 1px solid var(--line); background: var(--panel); }
        .admin-menu summary { padding: .9rem 1rem; color: var(--text); cursor: pointer; list-style: none; }
        .admin-menu summary::after { content: '+'; float: right; color: var(--accent); }
        .admin-menu details[open] summary::after { content: '-'; }
        .admin-menu .menu-options { display: grid; gap: .4rem; padding: 0 .6rem .6rem; }
        .admin-menu button { text-align: left; }
        .admin-section:not(.active) { display: none; }
        @media (max-width: 640px) { .admin-menu { grid-template-columns: 1fr; } }
        .image-row-header { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font: 500 .75rem 'DM Mono', monospace; text-transform: uppercase; }
        .image-row .row { grid-template-columns: repeat(2, 1fr); }
        .image-upload { display: flex; gap: .6rem; align-items: end; }
        .image-upload label { flex: 1; }
        .image-upload button { white-space: nowrap; }
        .image-order { display: grid; gap: .3rem; }
        .image-order button { padding: .3rem .55rem; min-width: 2rem; }
        .image-details { margin-top: .45rem; }
        .image-details summary { color: var(--muted); cursor: pointer; font-size: .75rem; }
        .image-fields { display: grid; gap: .6rem; margin-top: .6rem; }
        .crop-dialog { width: min(440px, calc(100% - 2rem)); padding: 1.2rem; color: var(--text); background: var(--panel); border: 1px solid var(--line); }
        .crop-dialog::backdrop { background: rgba(0, 0, 0, .78); }
        .crop-dialog h2 { margin-bottom: .8rem; }
        .crop-canvas-wrap { display: grid; place-items: center; background: #0b0d0c; padding: .6rem; }
        #cropCanvas { display: block; width: min(100%, 360px); aspect-ratio: 4 / 3; height: auto; }
        .crop-controls { display: grid; gap: .65rem; margin: 1rem 0; }
        .crop-controls label { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: .7rem; }
        .crop-actions { display: flex; justify-content: flex-end; gap: .6rem; }
        @media (max-width: 640px) { .image-row .row { grid-template-columns: 1fr; } .image-row { grid-template-columns: 64px minmax(0, 1fr) auto; } .image-preview { width: 64px; height: 52px; } .image-upload { display: grid; } }
    </style>
</head>
<body>
<main>
    <div class="eyebrow">LAYER 0 / Panel privado</div>
    <h1>Administrar contenido.</h1>
    <section class="panel" id="loginPanel">
        <h2>Iniciar sesión</h2>
        <form id="loginForm"><label>Correo<input id="email" type="email" required autocomplete="email"></label><label>Contraseña<input id="password" type="password" required autocomplete="current-password"></label><button>Entrar</button></form>
    </section>
    <section class="hidden" id="dashboard">
        <nav class="admin-menu" aria-label="Secciones del panel">
            <details open><summary>Proyectos</summary><div class="menu-options"><button class="secondary" type="button" data-admin-target="projects">Editar proyectos e imágenes</button><button class="secondary" type="button" data-admin-target="projects-list">Ver proyectos publicados</button></div></details>
            <details><summary>Servicios</summary><div class="menu-options"><button class="secondary" type="button" data-admin-target="services">Editar y ordenar servicios</button></div></details>
            <details><summary>Equipo</summary><div class="menu-options"><button class="secondary" type="button" data-admin-target="members">Editar miembros</button></div></details>
            <details><summary>Contenido y contacto</summary><div class="menu-options"><button class="secondary" type="button" data-admin-target="social">Contactos</button><button class="secondary" type="button" data-admin-target="content">Texto de inicio</button></div></details>
        </nav>
        <div class="panel admin-section active" data-admin-section="projects"><h2 id="projectFormTitle">Nuevo proyecto</h2><form id="projectForm"><input id="projectId" type="hidden"><label>Nombre<input id="projectTitle" required></label><div class="row"><label>Ubicación<input id="projectLocation" placeholder="Ciudad, país"></label><label>Mes y año<input id="projectDate" type="month"></label></div><label>Descripción<textarea id="projectDescription" placeholder="Concepto, materiales y alcance del proyecto"></textarea></label><div><label>Imágenes del proyecto</label><div class="image-editor" id="imageEditor"></div><button class="secondary" id="addImage" type="button">+ Añadir imagen</button></div><div class="row"><button id="projectSubmit">Guardar proyecto</button><button class="secondary hidden" id="cancelProjectEdit" type="button">Cancelar edición</button></div></form></div>
        <div class="panel admin-section" data-admin-section="members"><h2 id="memberFormTitle">Nuevo miembro</h2><form id="memberForm"><input id="memberId" type="hidden"><div class="row"><label>Nombre<input id="memberName" required></label><label>Rol<input id="memberRole" required></label></div><label>Profesión<input id="memberProfession" placeholder="Arquitecta, ingeniero, diseñadora..."></label><label>Descripción<textarea id="memberDescription" placeholder="Especialidad, experiencia o presentación"></textarea></label><div class="row"><div class="image-upload"><label>Foto desde tu computadora<input id="memberPhotoFile" type="file" accept="image/*"></label><button class="secondary" id="uploadMemberPhoto" type="button">Subir foto</button></div><label>Fotografía (URL)<input id="memberPhoto" type="url" placeholder="https://..."></label></div><label>Instagram (opcional)<input id="memberInstagram" type="url" placeholder="https://instagram.com/..."></label><div class="row"><button id="memberSubmit">Guardar miembro</button><button class="secondary hidden" id="cancelMemberEdit" type="button">Cancelar edición</button></div></form><div class="records" id="memberRecords"></div></div>
        <div class="panel admin-section" data-admin-section="social"><h2>Contactos</h2><form id="socialForm"><div class="row"><label>Instagram<input id="instagramUrl" type="url" placeholder="https://instagram.com/..."></label><label>Facebook<input id="facebookUrl" type="url" placeholder="https://facebook.com/..."></label></div><div class="row"><label>TikTok<input id="tiktokUrl" type="url" placeholder="https://tiktok.com/@..."></label><label>Correo<input id="emailUrl" type="email" placeholder="correo@ejemplo.com"></label></div><div id="whatsappFields"></div><button class="secondary" id="addWhatsapp" type="button">+ Añadir WhatsApp</button><button>Guardar contactos</button></form></div>
        <div class="panel admin-section" data-admin-section="content"><h2>Texto de inicio</h2><form id="contentForm"><label>Áreas superiores<input id="homeEyebrowInput" required></label><label>Título principal<input id="homeTitleInput" required></label><label>Texto descriptivo<textarea id="homeDescriptionInput" required></textarea></label><label>Texto del enlace<input id="homeCtaInput" required></label><button>Guardar texto de inicio</button></form></div>
        <div class="panel admin-section" data-admin-section="services"><h2 id="serviceFormTitle">Nuevo servicio</h2><form id="serviceForm"><input id="serviceId" type="hidden"><label>Nombre del servicio<input id="serviceTitle" required></label><label>Descripción<textarea id="serviceDescription" placeholder="Describe brevemente este servicio"></textarea></label><div class="row"><button id="serviceSubmit">Guardar servicio</button><button class="secondary hidden" id="cancelServiceEdit" type="button">Cancelar edición</button></div></form><div class="records" id="serviceRecords"></div></div>
        <div class="panel admin-section" data-admin-section="projects-list"><h2>Proyectos publicados</h2><div class="records" id="projectRecords"></div></div>
        <div class="panel"><button class="secondary" id="logout">Cerrar sesión</button></div>
    </section>
    <p class="status" id="status"></p>
</main>
<dialog class="crop-dialog" id="cropDialog">
    <h2>Ajustar imagen</h2>
    <div class="crop-canvas-wrap"><canvas id="cropCanvas" width="1200" height="900"></canvas></div>
    <div class="crop-controls">
        <label>Zoom<input id="cropZoom" type="range" min="1" max="3" step="0.05" value="1"></label>
        <label>Horizontal<input id="cropX" type="range" min="-100" max="100" value="0"></label>
        <label>Vertical<input id="cropY" type="range" min="-100" max="100" value="0"></label>
    </div>
    <div class="crop-actions"><button class="secondary" id="cancelCrop" type="button">Cancelar</button><button id="applyCrop" type="button">Usar este encuadre</button></div>
</dialog>
<script>
    const settings = window.SUPABASE_CONFIG;
    const loginPanel = document.getElementById('loginPanel');
    const dashboard = document.getElementById('dashboard');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const projectTitleInput = document.getElementById('projectTitle');
    const imageEditor = document.getElementById('imageEditor');
    const projectLocationInput = document.getElementById('projectLocation');
    const projectDescriptionInput = document.getElementById('projectDescription');
    const projectDateInput = document.getElementById('projectDate');
    const projectIdInput = document.getElementById('projectId');
    const projectFormTitle = document.getElementById('projectFormTitle');
    const projectSubmit = document.getElementById('projectSubmit');
    const cancelProjectEdit = document.getElementById('cancelProjectEdit');
    const memberNameInput = document.getElementById('memberName');
    const memberRoleInput = document.getElementById('memberRole');
    const memberDescriptionInput = document.getElementById('memberDescription');
    const memberPhotoInput = document.getElementById('memberPhoto');
    const memberPhotoFileInput = document.getElementById('memberPhotoFile');
    const uploadMemberPhotoButton = document.getElementById('uploadMemberPhoto');
    const memberInstagramInput = document.getElementById('memberInstagram');
    const memberProfessionInput = document.getElementById('memberProfession');
    const memberIdInput = document.getElementById('memberId');
    const memberFormTitle = document.getElementById('memberFormTitle');
    const memberSubmit = document.getElementById('memberSubmit');
    const cancelMemberEdit = document.getElementById('cancelMemberEdit');
    const contentInputs = {
        homeEyebrow: document.getElementById('homeEyebrowInput'),
        homeTitle: document.getElementById('homeTitleInput'),
        homeDescription: document.getElementById('homeDescriptionInput'),
        homeCta: document.getElementById('homeCtaInput')
    };
    const serviceTitleInput = document.getElementById('serviceTitle');
    const serviceDescriptionInput = document.getElementById('serviceDescription');
    const serviceIdInput = document.getElementById('serviceId');
    const serviceFormTitle = document.getElementById('serviceFormTitle');
    const serviceSubmit = document.getElementById('serviceSubmit');
    const cancelServiceEdit = document.getElementById('cancelServiceEdit');
    const status = document.getElementById('status');
    let serviceOrderBusy = false;
    const setStatus = message => { status.textContent = message; };
    const isConfigured = settings && settings.url && !settings.url.includes('TU-PROYECTO') && settings.anonKey && !settings.anonKey.includes('TU-CLAVE');
    const client = isConfigured ? supabase.createClient(settings.url, settings.anonKey) : null;
    if (!isConfigured) setStatus('Configura supabase-config.js con la URL y la clave pública de tu proyecto.');
    const showDashboard = () => { loginPanel.classList.add('hidden'); dashboard.classList.remove('hidden'); };
    const escapeHtml = value => String(value || '').replace(/[&<>'"]/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[character]));
    const explainDataError = error => error?.message?.includes('services') ? 'Supabase todavía no tiene la tabla services. Ejecuta supabase-schema.sql en SQL Editor y vuelve a cargar el panel.' : error?.message || 'No se pudo cargar el contenido.';
    const loadRecords = async () => {
        const [projectsResult, membersResult, socialResult, contentResult, servicesResult] = await Promise.all([
            client.from('projects').select('id, title, images, image_details, cover_image, location, description, project_date, is_example, sort_order').order('sort_order', { ascending: true }).order('created_at', { ascending: true }),
            client.from('members').select('id, name, role, profession, description, photo, instagram').order('created_at', { ascending: false }),
            client.from('social_links').select('platform, url'),
            client.from('site_content').select('content_key, content_value'),
            client.from('services').select('id, title, description, sort_order').order('sort_order', { ascending: true }).order('created_at', { ascending: true })
        ]);
        if (servicesResult.error) {
            setStatus(explainDataError(servicesResult.error));
        }
        const { data: projects } = projectsResult;
        const { data: members } = membersResult;
        const { data: social } = socialResult;
        const { data: content } = contentResult;
        const services = servicesResult.data || [];
        projectsCache = projects || [];
        membersCache = members || [];
        window.servicesCache = services || [];
        document.getElementById('serviceRecords').innerHTML = window.servicesCache.map((service, index) => `<div class="record"><span>${escapeHtml(service.title)}<small>${escapeHtml(service.description)}</small></span><span><span class="service-order"><button class="secondary" type="button" ${index === 0 ? 'disabled' : ''} onclick="moveService(${index}, -1)" aria-label="Subir servicio">↑</button><button class="secondary" type="button" ${index === window.servicesCache.length - 1 ? 'disabled' : ''} onclick="moveService(${index}, 1)" aria-label="Bajar servicio">↓</button></span><button type="button" onclick="editService(${service.id})">Editar</button> <button class="danger" type="button" onclick="deleteRecord('services', ${service.id}, 'Servicio eliminado.')">Eliminar</button></span></div>`).join('') || '<small>No hay servicios guardados.</small>';
        document.getElementById('projectRecords').innerHTML = projectsCache.map((project, index) => `<div class="record"><span>${escapeHtml(project.title)}<small>${escapeHtml(project.location)} · ${project.images.length} imagen(es)${project.is_example ? ' · ejemplo' : ''}</small></span><span><span class="service-order"><button class="secondary" type="button" ${index === 0 ? 'disabled' : ''} onclick="moveProject(${index}, -1)" aria-label="Subir proyecto">↑</button><button class="secondary" type="button" ${index === projectsCache.length - 1 ? 'disabled' : ''} onclick="moveProject(${index}, 1)" aria-label="Bajar proyecto">↓</button></span><button type="button" onclick="editProject(${project.id})">Editar</button> <button class="danger" type="button" onclick="deleteRecord('projects', ${project.id}, 'Proyecto eliminado.')">Eliminar</button></span></div>`).join('') || '<small>No hay proyectos guardados.</small>';
        document.getElementById('memberRecords').innerHTML = membersCache.map(member => `<div class="record"><span>${escapeHtml(member.name)}<small>${escapeHtml(member.profession || member.role)}</small></span><span><button type="button" onclick="editMember(${member.id})">Editar</button> <button class="danger" type="button" onclick="deleteRecord('members', ${member.id}, 'Miembro eliminado.')">Eliminar</button></span></div>`).join('') || '<small>No hay miembros guardados.</small>';
        (content || []).forEach(item => { if (contentInputs[item.content_key]) contentInputs[item.content_key].value = item.content_value; });
        (social || []).forEach(link => { const input = document.getElementById(`${link.platform}Url`); if (input) input.value = link.url; });
        const whatsappFields = document.getElementById('whatsappFields');
        whatsappFields.replaceChildren();
        const whatsapps = social?.filter(link => link.platform.startsWith('whatsapp_')) || [];
        (whatsapps.length ? whatsapps : [{ platform: 'whatsapp_1', url: '' }]).forEach(link => addWhatsappField(link.platform, link.url));
    };
    let projectsCache = [];
    let membersCache = [];
    const uploadProjectImage = async (file, row) => {
        if (!file) return;
        if (!file.type.startsWith('image/')) return setStatus('Selecciona un archivo de imagen.');
        const { data: { user } } = await client.auth.getUser();
        if (!user) return setStatus('Tu sesión expiró. Vuelve a iniciar sesión.');
        const extension = (file.name || '').split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || file.type.split('/')[1] || 'jpg';
        const path = `${user.id}/${crypto.randomUUID()}.${extension}`;
        const uploadButton = row.querySelector('.image-upload button');
        const urlInput = row.querySelector('.image-url');
        uploadButton.disabled = true;
        uploadButton.textContent = 'Subiendo...';
        setStatus('Subiendo imagen...');
        const { error } = await client.storage.from('project-images').upload(path, file, { upsert: false, contentType: file.type });
        if (error) {
            uploadButton.disabled = false;
            uploadButton.textContent = 'Subir imagen';
            return setStatus(`No se pudo subir la imagen: ${error.message}`);
        }
        const { data } = client.storage.from('project-images').getPublicUrl(path);
        urlInput.value = data.publicUrl;
        urlInput.dispatchEvent(new Event('input'));
        uploadButton.disabled = false;
        uploadButton.textContent = 'Subir imagen';
        setStatus('Imagen subida correctamente.');
    };
    const uploadMemberPhoto = async file => {
        if (!file) return setStatus('Selecciona una foto del miembro.');
        if (!file.type.startsWith('image/')) return setStatus('Selecciona un archivo de imagen.');
        const { data: { user } } = await client.auth.getUser();
        if (!user) return setStatus('Tu sesión expiró. Vuelve a iniciar sesión.');
        const extension = (file.name || '').split('.').pop().toLowerCase().replace(/[^a-z0-9]/g, '') || file.type.split('/')[1] || 'jpg';
        const path = `${user.id}/${crypto.randomUUID()}.${extension}`;
        uploadMemberPhotoButton.disabled = true;
        uploadMemberPhotoButton.textContent = 'Subiendo...';
        setStatus('Subiendo foto...');
        const { error } = await client.storage.from('member-photos').upload(path, file, { upsert: false, contentType: file.type });
        if (error) {
            uploadMemberPhotoButton.disabled = false;
            uploadMemberPhotoButton.textContent = 'Subir foto';
            return setStatus(`No se pudo subir la foto: ${error.message}`);
        }
        const { data } = client.storage.from('member-photos').getPublicUrl(path);
        memberPhotoInput.value = data.publicUrl;
        uploadMemberPhotoButton.disabled = false;
        uploadMemberPhotoButton.textContent = 'Subir foto';
        setStatus('Foto subida correctamente.');
    };
    const cropDialog = document.getElementById('cropDialog');
    const cropCanvas = document.getElementById('cropCanvas');
    const cropContext = cropCanvas.getContext('2d');
    const cropImage = new Image();
    const cropControls = { zoom: document.getElementById('cropZoom'), x: document.getElementById('cropX'), y: document.getElementById('cropY') };
    let cropObjectUrl = '';
    let cropCompletion = null;
    const drawCropPreview = () => {
        const viewportWidth = cropCanvas.width;
        const viewportHeight = cropCanvas.height;
        const scale = Math.max(viewportWidth / cropImage.naturalWidth, viewportHeight / cropImage.naturalHeight) * Number(cropControls.zoom.value);
        const scaledWidth = cropImage.naturalWidth * scale;
        const scaledHeight = cropImage.naturalHeight * scale;
        const overflowX = Math.max(0, scaledWidth - viewportWidth) / 2;
        const overflowY = Math.max(0, scaledHeight - viewportHeight) / 2;
        const offsetX = (viewportWidth - scaledWidth) / 2 - Number(cropControls.x.value) / 100 * overflowX;
        const offsetY = (viewportHeight - scaledHeight) / 2 - Number(cropControls.y.value) / 100 * overflowY;
        cropContext.clearRect(0, 0, viewportWidth, viewportHeight);
        cropContext.fillStyle = '#0b0d0c';
        cropContext.fillRect(0, 0, viewportWidth, viewportHeight);
        cropContext.drawImage(cropImage, offsetX, offsetY, scaledWidth, scaledHeight);
    };
    const finishCrop = result => {
        cropDialog.close();
        if (cropObjectUrl) URL.revokeObjectURL(cropObjectUrl);
        cropObjectUrl = '';
        const completion = cropCompletion;
        cropCompletion = null;
        if (completion) completion(result);
    };
    const openCropEditor = (file, completion) => {
        if (!file) return;
        cropCompletion = completion;
        cropObjectUrl = URL.createObjectURL(file);
        cropImage.onload = () => { cropControls.zoom.value = '1'; cropControls.x.value = '0'; cropControls.y.value = '0'; drawCropPreview(); cropDialog.showModal(); };
        cropImage.src = cropObjectUrl;
    };
    [cropControls.zoom, cropControls.x, cropControls.y].forEach(control => control.addEventListener('input', drawCropPreview));
    document.getElementById('cancelCrop').addEventListener('click', () => finishCrop(null));
    cropDialog.addEventListener('cancel', event => { event.preventDefault(); finishCrop(null); });
    document.getElementById('applyCrop').addEventListener('click', () => cropCanvas.toBlob(blob => finishCrop(blob), 'image/jpeg', .9));
    const addImageRow = (detail = {}) => {
        const row = document.createElement('div');
        row.className = 'image-row';
        row.innerHTML = `<img class="image-preview" alt="Vista previa de la imagen"><div class="image-row-content"><div class="image-row-header"><span>Imagen</span><button class="danger" type="button">Eliminar</button></div><details class="image-details"><summary>Mostrar información</summary><div class="image-fields"><div class="image-upload"><label>Archivo<input class="image-file" type="file" accept="image/*"></label><button class="secondary" type="button">Subir imagen</button></div><label>URL<input class="image-url" type="url" placeholder="https://..." required></label><label class="cover-choice"><input class="image-cover" type="radio" name="coverImage"> Usar como portada pública</label><label>Título<input class="image-title" placeholder="Vista exterior, detalle..." /></label><label>Descripción<textarea class="image-description" placeholder="Descripción de esta imagen"></textarea></label><div class="row"><label>Autor<input class="image-author" placeholder="Opcional"></label><label>Lugar<input class="image-location" placeholder="Opcional"></label></div><label>Fecha<input class="image-date" placeholder="Opcional"></label></div></details></div><div class="image-order"><button class="secondary move-image-up" type="button" aria-label="Subir imagen" title="Subir imagen">↑</button><button class="secondary move-image-down" type="button" aria-label="Bajar imagen" title="Bajar imagen">↓</button></div>`;
        row.querySelector('.image-url').value = detail.url || '';
        row.querySelector('.image-title').value = detail.title || '';
        row.querySelector('.image-description').value = detail.description || '';
        row.querySelector('.image-author').value = detail.author || '';
        row.querySelector('.image-location').value = detail.location || '';
        row.querySelector('.image-date').value = detail.date || '';
        row.querySelector('.image-cover').checked = detail.isCover === true;
        const preview = row.querySelector('.image-preview');
        const updatePreview = () => { preview.src = row.querySelector('.image-url').value.trim(); row.querySelector('.image-cover').value = row.querySelector('.image-url').value.trim(); };
        row.querySelector('.image-url').addEventListener('input', updatePreview);
        row.querySelector('.image-file').addEventListener('change', event => uploadProjectImage(event.target.files[0], row));
        row.querySelector('.image-upload button').addEventListener('click', () => uploadProjectImage(row.querySelector('.image-file').files[0], row));
        row.querySelector('.move-image-up').addEventListener('click', () => { const previous = row.previousElementSibling; if (previous) imageEditor.insertBefore(row, previous); });
        row.querySelector('.move-image-down').addEventListener('click', () => { const next = row.nextElementSibling; if (next) imageEditor.insertBefore(next, row); });
        updatePreview();
        row.querySelector('button').addEventListener('click', () => row.remove());
        imageEditor.appendChild(row);
    };
    const readImageDetails = () => [...imageEditor.querySelectorAll('.image-row')].map(row => ({ url: row.querySelector('.image-url').value.trim(), title: row.querySelector('.image-title').value.trim(), description: row.querySelector('.image-description').value.trim(), author: row.querySelector('.image-author').value.trim(), location: row.querySelector('.image-location').value.trim(), date: row.querySelector('.image-date').value.trim(), isCover: row.querySelector('.image-cover').checked })).filter(image => image.url);
    const resetProjectForm = () => { document.getElementById('projectForm').reset(); projectIdInput.value = ''; imageEditor.replaceChildren(); addImageRow(); projectFormTitle.textContent = 'Nuevo proyecto'; projectSubmit.textContent = 'Guardar proyecto'; cancelProjectEdit.classList.add('hidden'); };
    const resetMemberForm = () => { document.getElementById('memberForm').reset(); memberIdInput.value = ''; memberFormTitle.textContent = 'Nuevo miembro'; memberSubmit.textContent = 'Guardar miembro'; cancelMemberEdit.classList.add('hidden'); };
    const resetServiceForm = () => { document.getElementById('serviceForm').reset(); serviceIdInput.value = ''; serviceFormTitle.textContent = 'Nuevo servicio'; serviceSubmit.textContent = 'Guardar servicio'; cancelServiceEdit.classList.add('hidden'); };
    window.editProject = id => { const project = projectsCache.find(item => item.id === id); if (!project) return; projectIdInput.value = project.id; projectTitleInput.value = project.title; projectLocationInput.value = project.location || ''; projectDescriptionInput.value = project.description || ''; projectDateInput.value = project.project_date ? project.project_date.slice(0, 7) : ''; imageEditor.replaceChildren(); const details = Array.isArray(project.image_details) && project.image_details.length ? project.image_details : project.images.map(url => ({ url })); details.forEach((detail, index) => addImageRow({ ...detail, isCover: project.cover_image ? detail.url === project.cover_image : index === 0 })); projectFormTitle.textContent = 'Editar proyecto'; projectSubmit.textContent = 'Actualizar proyecto'; cancelProjectEdit.classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    window.editMember = id => { const member = membersCache.find(item => item.id === id); if (!member) return; memberIdInput.value = member.id; memberNameInput.value = member.name; memberRoleInput.value = member.role; memberProfessionInput.value = member.profession || ''; memberDescriptionInput.value = member.description || ''; memberPhotoInput.value = member.photo || ''; memberInstagramInput.value = member.instagram || ''; memberFormTitle.textContent = 'Editar miembro'; memberSubmit.textContent = 'Actualizar miembro'; cancelMemberEdit.classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    window.editService = id => { const service = (window.servicesCache || []).find(item => item.id === id); if (!service) return; serviceIdInput.value = service.id; serviceTitleInput.value = service.title; serviceDescriptionInput.value = service.description || ''; serviceFormTitle.textContent = 'Editar servicio'; serviceSubmit.textContent = 'Actualizar servicio'; cancelServiceEdit.classList.remove('hidden'); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    window.moveService = async (index, direction) => { if (serviceOrderBusy) return; const services = [...(window.servicesCache || [])]; const targetIndex = index + direction; if (!services[targetIndex]) return; serviceOrderBusy = true; setStatus('Guardando orden...'); const reordered = [...services]; [reordered[index], reordered[targetIndex]] = [reordered[targetIndex], reordered[index]]; const updates = reordered.map((service, order) => client.from('services').update({ sort_order: order }).eq('id', service.id)); const results = await Promise.all(updates); const error = results.find(result => result.error)?.error; serviceOrderBusy = false; if (error) { setStatus(explainDataError(error)); return; } setStatus('Orden de servicios actualizado.'); await loadRecords(); };
    let projectOrderBusy = false;
    window.moveProject = async (index, direction) => { if (projectOrderBusy) return; const projects = [...projectsCache]; const targetIndex = index + direction; if (!projects[targetIndex]) return; projectOrderBusy = true; setStatus('Guardando orden de proyectos...'); [projects[index], projects[targetIndex]] = [projects[targetIndex], projects[index]]; const updates = projects.map((project, order) => client.from('projects').update({ sort_order: order }).eq('id', project.id)); const results = await Promise.all(updates); const error = results.find(result => result.error)?.error; projectOrderBusy = false; if (error) { setStatus(explainDataError(error)); return; } setStatus('Orden de proyectos actualizado.'); await loadRecords(); };
    const addWhatsappField = (platform, value = '') => { const label = document.createElement('label'); label.textContent = `WhatsApp ${platform.split('_')[1] || ''}`; const input = document.createElement('input'); input.type = 'url'; input.id = `${platform}Url`; input.placeholder = 'https://wa.me/521...'; input.value = value; const remove = document.createElement('button'); remove.type = 'button'; remove.className = 'secondary'; remove.textContent = 'Quitar número'; remove.addEventListener('click', () => label.remove()); label.append(input, remove); document.getElementById('whatsappFields').appendChild(label); };
    document.getElementById('addWhatsapp').addEventListener('click', () => addWhatsappField(`whatsapp_${document.querySelectorAll('#whatsappFields input').length + 1}`));
    uploadMemberPhotoButton.addEventListener('click', () => openCropEditor(memberPhotoFileInput.files[0], croppedFile => croppedFile && uploadMemberPhoto(croppedFile)));
    memberPhotoFileInput.addEventListener('change', () => openCropEditor(memberPhotoFileInput.files[0], croppedFile => croppedFile && uploadMemberPhoto(croppedFile)));
    window.deleteRecord = async (table, id, message) => { if (!confirm('¿Eliminar este elemento?')) return; const { error } = await client.from(table).delete().eq('id', id); setStatus(error ? error.message : message); if (!error) loadRecords(); };
    const explainAuthError = error => {
        if (error.message.includes('Invalid login credentials')) return 'Correo o contraseña incorrectos. Verifica que el usuario exista en Supabase > Authentication > Users.';
        if (error.message.toLowerCase().includes('email not confirmed')) return 'Confirma el correo de Supabase antes de iniciar sesión o activa Auto Confirm User.';
        return error.message;
    };
    if (client) client.auth.getSession().then(({ data }) => { if (data.session) showDashboard(); });
    document.getElementById('loginForm').addEventListener('submit', async event => {
        event.preventDefault(); if (!client) return setStatus('Falta configurar Supabase.'); setStatus('Iniciando sesión...');
        try {
            const { error } = await client.auth.signInWithPassword({ email: emailInput.value.trim(), password: passwordInput.value });
            if (error) return setStatus(explainAuthError(error));
        } catch (error) {
            return setStatus(`No se pudo conectar con Supabase: ${error.message}`);
        }
        showDashboard(); loadRecords(); setStatus('Sesión iniciada.');
    });
    document.getElementById('projectForm').addEventListener('submit', async event => {
        event.preventDefault(); const imageDetails = readImageDetails(); const images = imageDetails.map(image => image.url); const coverImage = imageDetails.find(image => image.isCover)?.url || images[0] || '';
        const nextProjectOrder = projectsCache.length ? Math.max(...projectsCache.map(project => Number.isFinite(project.sort_order) ? project.sort_order : -1)) + 1 : 0;
        const project = { title: projectTitleInput.value, images, image_details: imageDetails, cover_image: coverImage, location: projectLocationInput.value, description: projectDescriptionInput.value, project_date: projectDateInput.value ? `${projectDateInput.value}-01` : null, ...(projectIdInput.value ? {} : { sort_order: nextProjectOrder }) };
        const query = projectIdInput.value ? client.from('projects').update(project).eq('id', projectIdInput.value) : client.from('projects').insert(project);
        const { error } = await query;
        setStatus(error ? error.message : projectIdInput.value ? 'Proyecto actualizado correctamente.' : 'Proyecto guardado correctamente.'); if (!error) { resetProjectForm(); loadRecords(); }
    });
    document.getElementById('memberForm').addEventListener('submit', async event => {
        event.preventDefault(); const member = { name: memberNameInput.value, role: memberRoleInput.value, profession: memberProfessionInput.value, description: memberDescriptionInput.value, photo: memberPhotoInput.value, instagram: memberInstagramInput.value };
        const query = memberIdInput.value ? client.from('members').update(member).eq('id', memberIdInput.value) : client.from('members').insert(member);
        const { error } = await query;
        setStatus(error ? error.message : memberIdInput.value ? 'Miembro actualizado correctamente.' : 'Miembro guardado correctamente.'); if (!error) { resetMemberForm(); loadRecords(); }
    });
    document.getElementById('serviceForm').addEventListener('submit', async event => {
        event.preventDefault();
        const service = { title: serviceTitleInput.value.trim(), description: serviceDescriptionInput.value.trim() };
        const query = serviceIdInput.value ? client.from('services').update(service).eq('id', serviceIdInput.value) : client.from('services').insert(service);
        const { error } = await query;
        setStatus(error ? explainDataError(error) : serviceIdInput.value ? 'Servicio actualizado correctamente.' : 'Servicio guardado correctamente.');
        if (!error) { resetServiceForm(); loadRecords(); }
    });
    document.getElementById('contentForm').addEventListener('submit', async event => {
        event.preventDefault();
        const content = Object.entries(contentInputs).map(([content_key, input]) => ({ content_key, content_value: input.value.trim() }));
        const { error } = await client.from('site_content').upsert(content, { onConflict: 'content_key' });
        setStatus(error ? error.message : 'Texto de inicio guardado correctamente.');
    });
    document.getElementById('socialForm').addEventListener('submit', async event => {
        event.preventDefault(); const links = ['instagram', 'facebook', 'tiktok', 'email'].map(platform => ({ platform, url: document.getElementById(`${platform}Url`).value.trim() })).filter(link => link.url).concat([...document.querySelectorAll('#whatsappFields input')].map(input => ({ platform: input.id.replace('Url', ''), url: input.value.trim() })).filter(link => link.url));
        const { error: removeWhatsappError } = await client.from('social_links').delete().like('platform', 'whatsapp_%');
        if (removeWhatsappError) return setStatus(removeWhatsappError.message);
        const { error: removeLinkedInError } = await client.from('social_links').delete().eq('platform', 'linkedin');
        if (removeLinkedInError) return setStatus(removeLinkedInError.message);
        const { error } = await client.from('social_links').upsert(links, { onConflict: 'platform' });
        setStatus(error ? error.message : 'Enlaces sociales guardados.'); if (!error) loadRecords();
    });
    cancelProjectEdit.addEventListener('click', resetProjectForm);
    document.getElementById('addImage').addEventListener('click', () => addImageRow());
    cancelMemberEdit.addEventListener('click', resetMemberForm);
    cancelServiceEdit.addEventListener('click', resetServiceForm);
    document.querySelectorAll('[data-admin-target]').forEach(button => button.addEventListener('click', () => { const target = button.dataset.adminTarget; document.querySelectorAll('[data-admin-section]').forEach(section => section.classList.toggle('active', section.dataset.adminSection === target)); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
    document.getElementById('logout').addEventListener('click', async () => { await client.auth.signOut(); dashboard.classList.add('hidden'); loginPanel.classList.remove('hidden'); setStatus('Sesión cerrada.'); });
    if (client) client.auth.getSession().then(({ data }) => { if (data.session) { showDashboard(); loadRecords(); } });
    addImageRow();
</script>
</body>
</html>
